[build]
  publish = "public"

[build.environment]
  NODE_VERSION = "18"

# ========================================================
# ASSET OPTIMIZATION - FORCE PRETTY URLS ON LIVE SERVER
# ========================================================
[build.processing.html]
  pretty_urls = true

# ========================================================
# PLUGINS
# ========================================================
[[plugins]]
  package = "@netlify/plugin-lighthouse"

